name: Architecture Lock

# Enforces the FaraTaraz Modular Clean Architecture (FMCA) invariants on every push and
# pull request. The architecture tests are the guardrail: they assert the layering, CQRS,
# tenant-source ownership, provider independence and physical-structure invariants, so any
# drift FAILS the build rather than being silently accepted.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# No network secrets are required; no deployment. The workflow only builds and tests.
permissions:
  contents: read

jobs:
  architecture-lock:
    name: FMCA invariants (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # W2 Persistence Foundation: the integration suite exercises real PostgreSQL behaviour
    # (tenant isolation, unique-constraint idempotency, transactional rollback) — never the
    # EF Core InMemory provider (ADR-010 decision 12). CI provisions a disposable PostgreSQL
    # service and points the integration fixture at it via the connection-string override.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ftpw
          POSTGRES_DB: farataraz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Integration fixture override so the fixture connects to the provisioned service
    # (published on localhost:5432) regardless of the local default (port 54320).
    env:
      FATARAZ_INTEGRATION_TEST_CONNECTION_STRING: >-
        Host=localhost;Port=5432;Username=postgres;Password=ftpw;Database=farataraz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          version: 10.x

      # Debug build — zero warnings, zero errors.
      - name: Debug build
        run: dotnet build FaraTaraz.sln -c Debug
        shell: pwsh

      # Debug: all suites. The architecture suite fails on any invariant breach.
      - name: Debug tests
        run: dotnet test FaraTaraz.sln -c Debug --no-build
        shell: pwsh

      # Release build — zero warnings, zero errors.
      - name: Release build
        run: dotnet build FaraTaraz.sln -c Release
        shell: pwsh

      # Release: all suites.
      - name: Release tests
        run: dotnet test FaraTaraz.sln -c Release --no-build
        shell: pwsh

      # Guard: `git diff --check` must report no whitespace/line-ending errors.
      - name: Whitespace guard (git diff --check)
        run: |
          git diff --check
        shell: pwsh
