name: Architecture Lock

# Enforces the FaraTaraz Modular Clean Architecture (FMCA) invariants on every push and
# pull request. The architecture tests are the guardrail: they assert the layering, CQRS,
# tenant-source ownership, provider independence and physical-structure invariants, so any
# drift FAILS the build rather than being silently accepted.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# No network secrets are required; no deployment. The workflow only builds and tests.
permissions:
  contents: read

jobs:
  architecture-lock:
    name: FMCA invariants (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # W2 Persistence Foundation: the integration suite exercises real PostgreSQL behaviour
    # (tenant isolation, unique-constraint idempotency, transactional rollback) — never the
    # EF Core InMemory provider, SQLite or a mock (ADR-010 decision 12). CI installs and starts
    # a real, native PostgreSQL 16 from the Ubuntu package archive. There is NO service container,
    # so there is no pre-checkout Docker image pull. The integration fixture is pointed at the
    # native server through this override; the test role/password are disposable CI-only values.
    env:
      FATARAZ_INTEGRATION_TEST_CONNECTION_STRING: >-
        Host=127.0.0.1;Port=5432;Username=farataraz;Password=ftpw;Database=farataraz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Native PostgreSQL 16 (no Docker). Explicit install + start + dedicated disposable
      # role/database + readiness verification, with diagnostics on failure. Credentials are
      # never printed.
      - name: Provision and start native PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Install PostgreSQL 16"
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "Installed packages:"
          dpkg -l | grep -E '^ii[[:space:]]+postgresql' || true
          echo "::endgroup::"

          echo "::group::Start PostgreSQL cluster"
          # The runner does not reliably manage the cluster through systemd; start it explicitly.
          if sudo pg_lsclusters -h 2>/dev/null | awk '{print $1" "$2}' | grep -qx '16 main'; then
            sudo pg_ctlcluster 16 main start || true
          else
            sudo pg_createcluster 16 main --start
          fi
          sudo pg_lsclusters
          echo "::endgroup::"

          echo "::group::Create disposable test role and database"
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE farataraz LOGIN PASSWORD 'ftpw';
          CREATE DATABASE farataraz OWNER farataraz;
          SQL
          echo "::endgroup::"

          echo "::group::Readiness verification"
          ready=""
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U farataraz -d farataraz >/dev/null 2>&1; then
              ready="yes"
              echo "PostgreSQL accepted connections after ${i} attempt(s)."
              break
            fi
            echo "Waiting for PostgreSQL to accept connections (attempt ${i}/30)..."
            sleep 2
          done

          if [ -z "${ready}" ]; then
            echo "::error::PostgreSQL did not become ready on 127.0.0.1:5432"
            sudo pg_lsclusters || true
            sudo tail -n 100 /var/log/postgresql/postgresql-16-main.log || true
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Connection and version check"
          # Prove the TCP password path the integration tests use actually works, then print the
          # server version. The password is never echoed.
          if ! PGPASSWORD=ftpw psql -h 127.0.0.1 -p 5432 -U farataraz -d farataraz \
                -v ON_ERROR_STOP=1 -tAc "SELECT version();"; then
            echo "::error::Could not authenticate to PostgreSQL over TCP with the test credentials"
            sudo tail -n 100 /var/log/postgresql/postgresql-16-main.log || true
            exit 1
          fi
          echo "::endgroup::"

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      # Debug build — zero warnings, zero errors.
      - name: Debug build
        run: dotnet build FaraTaraz.sln -c Debug
        shell: pwsh

      # Debug: all suites. The architecture suite fails on any invariant breach.
      # On failure, surface the failing test names as annotations (the raw job log requires
      # repository admin rights, so annotations are the only publicly readable failure detail).
      - name: Debug tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'debug-tests.log'
          dotnet test FaraTaraz.sln -c Debug --no-build 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $failed = Select-String -Path $log -Pattern '^\s*Failed\s+\S' | Select-Object -First 15 |
              ForEach-Object { $_.Line.Trim() }
            if ($failed.Count -eq 0) { $failed = @('dotnet test failed; see the job log') }
            Write-Output ("::error title=Debug tests failed::" + ($failed -join ' || '))
            exit $code
          }

      # Release build — zero warnings, zero errors.
      - name: Release build
        run: dotnet build FaraTaraz.sln -c Release
        shell: pwsh

      # Release: all suites.
      - name: Release tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'release-tests.log'
          dotnet test FaraTaraz.sln -c Release --no-build 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $failed = Select-String -Path $log -Pattern '^\s*Failed\s+\S' | Select-Object -First 15 |
              ForEach-Object { $_.Line.Trim() }
            if ($failed.Count -eq 0) { $failed = @('dotnet test failed; see the job log') }
            Write-Output ("::error title=Release tests failed::" + ($failed -join ' || '))
            exit $code
          }

      # Guard: `git diff --check` must report no whitespace/line-ending errors.
      - name: Whitespace guard (git diff --check)
        run: |
          git diff --check
        shell: pwsh
